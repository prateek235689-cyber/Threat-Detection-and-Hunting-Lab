title: Suspicious PowerShell Execution Characteristics
id: 83e7d54e-5d39-4b4d-a950-c82e75bb8597
status: experimental
description: >
  Detects PowerShell execution containing multiple command-line
  characteristics that may warrant analyst investigation.
author: Prateek Gupta
date: 2026-09-13

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith: '\powershell.exe'

  selection_flags:
    CommandLine|contains:
      - '-NoProfile'
      - '-NonInteractive'
      - '-WindowStyle Hidden'
      - '-EncodedCommand'

  condition: selection_image and 2 of selection_flags

falsepositives:
  - Administrative PowerShell scripts
  - Software deployment and management tools
  - Automated maintenance tasks
  - Security and monitoring software

level: medium

tags:
  - attack.execution
  - attack.t1059.001
