title: Suspicious PowerShell Execution Characteristics
id: 83e7d54e-5d39-4b4d-a950-c82e75bb8597
status: experimental
description: >
  Detects PowerShell execution containing multiple command-line
  characteristics that may warrant analyst investigation.
author: Prateek Gupta
date: 2026-09-13

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith: '\powershell.exe'

  flag_noprofile:
    CommandLine|contains: '-NoProfile'

  flag_noninteractive:
    CommandLine|contains: '-NonInteractive'

  flag_hidden:
    CommandLine|contains: '-WindowStyle Hidden'

  flag_encoded:
    CommandLine|contains: '-EncodedCommand'

  condition: selection_image and ((flag_noprofile and flag_noninteractive) or (flag_noprofile and flag_hidden) or (flag_noprofile and flag_encoded) or (flag_noninteractive and flag_hidden) or (flag_noninteractive and flag_encoded) or (flag_hidden and flag_encoded))

falsepositives:
  - Administrative PowerShell scripts
  - Software deployment and management tools
  - Automated maintenance tasks
  - Security and monitoring software

level: medium

tags:
  - attack.execution
  - attack.t1059.001
